      <text x="898" y="367" font-size="16" font-weight="500" fill="#C7EEF2">Semantic coverage</text>
      <text x="66" y="433" font-size="13" font-weight="500" letter-spacing="2" fill="#999DBD">SAMPLE QUALITY + SET COVERAGE</text>
      <text x="1334" y="433" text-anchor="end" font-size="13" fill="#999DBD">Image–mask datasets for semantic segmentation</text>
