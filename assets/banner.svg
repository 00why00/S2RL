      <text x="66" y="255" font-size="30" font-weight="600" letter-spacing="-.5" fill="#F0EDFF">Sample-Set Dual Reinforcement Learning</text>
      <text x="66" y="299" font-size="21" fill="#B9BAD3">Better samples. Broader semantic coverage.</text>

      <rect x="66" y="335" width="160" height="34" rx="17" fill="#A78BFA" fill-opacity=".13" stroke="#A78BFA" stroke-opacity=".28"/>
      <text x="146" y="357" text-anchor="middle" font-size="14" font-weight="600" fill="#DDD6FE">SD3.5 MEDIUM</text>
      <rect x="237" y="335" width="110" height="34" rx="17" fill="#67E8F9" fill-opacity=".08" stroke="#67E8F9" stroke-opacity=".23"/>
      <text x="292" y="357" text-anchor="middle" font-size="14" font-weight="600" fill="#BAF3FA">ADE20K</text>
      <rect x="358" y="335" width="87" height="34" rx="17" fill="#67E8F9" fill-opacity=".08" stroke="#67E8F9" stroke-opacity=".23"/>
