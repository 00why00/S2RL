    <circle cx="1270" cy="88" r="335" stroke="#76B3DB" stroke-opacity=".08"/>
    <circle cx="1270" cy="88" r="379" stroke="#76B3DB" stroke-opacity=".06"/>
    <path d="M65 403H1335" stroke="#C7D2FE" stroke-opacity=".12"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
