<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" fill="none" role="img" aria-labelledby="title description">
  <title id="title">S²-RL — Sample-Set Dual Reinforcement Learning</title>
  <desc id="description">An alembic mark beside S²-RL on a purple and blue banner with illustrated image and segmentation-mask cards. Sample-level alignment and diversity combine with set-level semantic coverage for generative dataset distillation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1400" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18162E"/>
      <stop offset=".5" stop-color="#242145"/>
      <stop offset="1" stop-color="#142D43"/>
    </linearGradient>
    <linearGradient id="accent" x1="63" y1="0" x2="592" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80B9EE"/>
      <stop offset="1" stop-color="#D1E6F9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#C4B5FD" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="round"><rect width="1400" height="460" rx="28"/></clipPath>
    <clipPath id="photo"><rect x="897" y="127" width="198" height="157" rx="9"/></clipPath>
    <clipPath id="mask"><rect x="1095" y="191" width="198" height="157" rx="9"/></clipPath>
  </defs>
