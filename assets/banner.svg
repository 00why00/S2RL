      <rect x="1100" y="179" width="230" height="214" rx="16" fill="#101D31" stroke="#7EB0C7" stroke-opacity=".3"/>
      <rect x="1079" y="155" width="230" height="218" rx="16" fill="#F0F1FB"/>
      <circle cx="1098" cy="174" r="4" fill="#24ABA9"/>
